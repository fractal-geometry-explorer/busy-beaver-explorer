# Publishes pages/ to GitHub Pages on every push to main. The shared holdout pages (index, families, recent results,
# ranking) are not committed; they are built here from the machine folders, so parallel pull requests do not conflict.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: Build the shared holdout pages
        run: |
          python3 holdouts/build_pages.py --index-only
          cp holdouts/RANKING.md holdouts/ranking.json pages/holdouts/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
