<div class="panel" id="lw">
<div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px">
  <label for="lw-pre">Start from the run at</label>
  <select id="lw-pre"></select>
</div>
<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px">
  <button type="button" id="lw-1">Next event</button>
  <button type="button" id="lw-w">To the next wrap of Z</button>
  <button type="button" id="lw-100">+1,000 events</button>
  <button type="button" id="lw-m">Check this event on the machine</button>
</div>
<div id="lw-out" style="overflow-x:auto"></div>
<p id="lw-msg" style="color:var(--muted)"></p>
</div>
<script>
// The layer law of lean/Layers.lean: the same functions on digit lists (lowest digit first), and a check of one
// event against the machine itself (a plain simulator of the table).
(function () {
"use strict";
const PRE = __PRESETS__;
const TM = "1RB---_1LC0RF_0RA0LD_1LE1LA_1RF0LF_0LC0RA";
const $ = (id) => document.getElementById(id);
const bits = (s) => s.split("").map((c) => c === "1");
const str = (w) => w.map((b) => (b ? "1" : "0")).join("");
const val = (w) => w.reduce((a, b, i) => a + (b ? 2 ** i : 0), 0);
function incB(w) {
  if (!w.length) return [[], true];
  if (!w[0]) return [[true].concat(w.slice(1)), false];
  const [r, c] = incB(w.slice(1));
  return [[false].concat(r), c];
}
// st: {n, nw, z, items: [[q, p], ...]} (the last item's p is R).  units[i]: units sent into item i in this event.
let st, units, lastWrap, events;
function unit(i) {               // a unit into item i: Q gets 3, every wrap of Q gives P 3, every wrap of P a unit to i+1
  units[i]++;
  for (let a = 0; a < 3; a++) {
    const [q, c] = incB(st.items[i][0]); st.items[i][0] = q;
    if (!c) continue;
    for (let b = 0; b < 3; b++) {
      const [p, d] = incB(st.items[i][1]); st.items[i][1] = p;
      if (!d) continue;
      if (i + 1 === st.items.length) return false;     // a carry leaves R: not covered by the law
      if (!unit(i + 1)) return false;
    }
  }
  return true;
}
function event() {
  units = st.items.map(() => 0);
  st.n++; if (st.n === 3 ** st.nw) { st.n = 0; st.nw++; }
  const [z, c] = incB(st.z); st.z = z; events++;
  lastWrap = c;
  if (c && !unit(0)) return false;
  return true;
}
function tape() {   // cells: left part (N) and right part from the event cell
  const D3 = ["100", "110", "010"];
  let ds = [], x = st.n;
  for (let i = 0; i < st.nw; i++) { ds.push(D3[x % 3]); x = Math.floor(x / 3); }
  const left = "10" + ds.reverse().join("");
  const ZD = ["0010", "1010"], QD = ["0001", "0101"], PD = ["1000", "1010"];
  let r = "0" + st.z.map((b) => ZD[+b]).join("");
  st.items.forEach(([q, p], i) => {
    r += "11" + q.map((b) => QD[+b]).join("") + "01" + p.map((b) => PD[+b]).join("");
    if (i + 1 < st.items.length) r += "10";
  });
  return [left, r];
}
function machine(left, right, maxSteps) {   // run from the event to the next event; returns the right part
  const T = {}; const tb = [];
  TM.split("_").forEach((p, i) => { for (let r = 0; r < 2; r++) { const t = p.substr(3 * r, 3); tb[2 * i + r] = t[2] === "-" ? null : [+t[0], t[1] === "R" ? 1 : -1, t.charCodeAt(2) - 65]; } });
  for (let i = 0; i < left.length; i++) T[i - left.length] = +left[i];
  for (let i = 0; i < right.length; i++) T[i] = +right[i];
  let p = 0, s = 0, hi = right.length;
  for (let k = 0; k < maxSteps; k++) {
    const tr = tb[2 * s + (T[p] || 0)];
    if (!tr) return { halt: true, steps: k };
    T[p] = tr[0]; p += tr[1]; s = tr[2]; if (p > hi) hi = p;
    if (p === 0 && s === 0 && !(T[0] || 0)) {
      let o = ""; for (let i = 0; i <= hi; i++) o += T[i] || 0;
      return { right: o, steps: k + 1 };
    }
  }
  return { timeout: true };
}
function show(msg) {
  const rows = [["Z", st.z, "", "1"]];
  let w = 2 ** st.z.length / 3, wtxt = "2^" + st.z.length + "/3";
  st.items.forEach(([q, p], i) => {
    const last = i + 1 === st.items.length;
    rows.push(["Q" + (i + 1), q, units ? units[i] : 0, wtxt]);
    wtxt += " · 2^" + q.length + "/3";
    rows.push([last ? "R" : "P" + (i + 1), p, "", wtxt]);
    wtxt += " · 2^" + p.length + "/3";
  });
  let h = '<table class="tbl"><thead><tr><th>word</th><th>digits (lowest first)</th><th>width</th><th>value</th><th>units in (last event)</th><th>weight</th></tr></thead><tbody>';
  rows.forEach(([nm, wd, u, wt]) => {
    h += `<tr><td><b>${nm}</b></td><td><code>${str(wd) || "(empty)"}</code></td><td>${wd.length}</td><td>${val(wd)}</td><td>${nm[0] === "Q" ? u : ""}</td><td><code>${wt}</code></td></tr>`;
  });
  h += "</tbody></table>";
  $("lw-out").innerHTML = h;
  $("lw-msg").innerHTML = `N = ${st.n} (${st.nw} base-3 digits); ${events} events from the preset. ` + (msg || "");
}
function load(i) {
  const p = PRE[i][1];
  st = { n: p.n, nw: p.nw, z: bits(p.z), items: p.items.map(([q, r]) => [bits(q), bits(r)]) };
  units = null; events = 0; show("");
}
PRE.forEach(([sh, p], i) => { const o = document.createElement("option"); o.value = i; o.textContent = `step ${p.step.toLocaleString("en-US")}: ${sh}`; $("lw-pre").appendChild(o); });
$("lw-pre").value = PRE.length - 1;
$("lw-pre").onchange = () => load(+$("lw-pre").value);
const stop = "A carry left R: this is an overflow of R, which the law does not cover (choose another preset).";
$("lw-1").onclick = () => { show(event() ? (lastWrap ? "Z wrapped and sent one unit into the chain." : "") : stop); };
$("lw-w").onclick = () => { let ok = true; do { ok = event(); } while (ok && !lastWrap); show(ok ? "Z wrapped and sent one unit into the chain." : stop); };
$("lw-100").onclick = () => { let ok = true; for (let i = 0; i < 1000 && ok; i++) ok = event(); show(ok ? "" : stop); };
$("lw-m").onclick = () => {
  const [l, r] = tape();
  const res = machine(l, r, 5e6);
  const ok = event(); const [l2, r2] = tape();
  if (!ok) { show(stop); return; }
  if (res.right === undefined) { show("The machine did not reach the next event."); return; }
  const same = res.right.replace(/0+$/, "") === r2.replace(/0+$/, "");
  show(same ? `The machine ran ${res.steps.toLocaleString("en-US")} steps to the next event and left exactly the predicted tape.` : "The machine's tape differs from the prediction.");
};
load(PRE.length - 1);
})();
</script>
