<!doctype html>

<title>Collatz-like holdouts</title>
<meta name="description" content="Triage of the 98 BB(6) holdouts whose run is the orbit of a Collatz-like map: which maps are proved, which halts are within reach of computation, which need decoding, and which are pure number theory. With an in-browser runner for 20 of the maps.">

<style>
